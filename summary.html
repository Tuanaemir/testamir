<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fashion Summary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    h2, h1, h3 {
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 40px;
    }

    th, td {
      border: 1px solid #999;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #ddd;
    }

    tr.sale {
      background-color: #ffe0b3;
    }

    a {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #007bff;
    }

    #output {
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>KYREX FASHION CATALOG</h1>
  <h2>ONLINE STYLE DISPLAY</h2>
  <h3>KYREX SHOPPING SECTION</h3>

  <div style="text-align: center;">
    <a href="catalog-women.html">← Back</a>
  </div>

  <div id="output">Loading data...</div>

  <script>
    Promise.all([
      fetch('fashion.xml').then(res => res.text()),
      fetch('fashion.xsl').then(res => res.text())
    ])
    .then(([xmlText, xslText]) => {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const xsl = parser.parseFromString(xslText, "text/xml");

      const xsltProcessor = new XSLTProcessor();
      xsltProcessor.importStylesheet(xsl);
      const resultFragment = xsltProcessor.transformToFragment(xml, document);

      const outputDiv = document.getElementById("output");
      outputDiv.innerHTML = '';
      outputDiv.appendChild(resultFragment);
    })
    .catch(err => {
      console.error("Error loading or transforming:", err);
      document.getElementById("output").innerText = "Failed to load fashion list.";
    });
  </script>

</body>
</html>
